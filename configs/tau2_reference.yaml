# Baseline cascaded pipeline. Swap any component by editing provider/model.
name: tau2_reference
prompt: tau2_reference   # tau2 LLMAgent prompt verbatim = control

llm:
  provider: openai          # openai | anthropic | google | groq | cerebras | ...
  model: gpt-4.1-mini
  kwargs: {temperature: 0.0}
stt:
  provider: deepgram        # deepgram | openai | groq
  model: nova-3
tts:
  provider: openai          # openai | deepgram | cartesia
  model: gpt-4o-mini-tts
  voice: ash

audio_loop:
  enabled: false            # --audio flag flips this: user TTS -> agent STT each turn
  user_tts: {provider: openai, model: gpt-4o-mini-tts, voice: coral}
  synthesize_agent: false   # true = also TTS every agent reply (latency numbers, costs more)
  save_audio_dir: null      # e.g. audio_out  -> wavs for the Loom

domain: retail
task_split: test            # 40 tasks. train=74, base=114
num_trials: 1               # 3-4 for pass^k once the prompt stabilises
user_llm: openai/gpt-4.1-mini
max_concurrency: 4
